name: MDM Deploy Notification
description: Send a notification to Microsoft Teams when a deployment finished
inputs:
  webhook:
    description: Webhook URL
    required: true
  env:
    description: Name of the environment
    required: true
  application:
    description: Name of the application
    required: true
  version:
    description: Version of the application
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        echo "::warning title=Microsoft Teams Webhook Deprecation::Microsoft has deprecated the Office 365 Connectors (Incoming Webhooks) for Microsoft Teams. Please migrate to Power Automate Workflows or another supported integration."
